<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>이거 입어! · 3초 컷 코디 처방전</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg: #F8F9FA;
    --card: #FFFFFF;
    --navy: #1E293B;
    --navy-2: #334155;
    --blue: #2563EB;
    --blue-soft: #DBEAFE;
    --sky: #EFF6FF;
    --sky-2: #BFDBFE;
    --line: #E2E8F0;
    --muted: #64748B;
    --pink: #F43F5E;
    --pink-soft: #FFE4E6;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 999px;
    --shadow: 0 10px 30px -12px rgba(30, 41, 59, 0.18);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--navy);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    letter-spacing: -0.01em;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  button { font-family: inherit; color: inherit; }

  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: 20px 18px 120px;
    position: relative;
  }

  /* ---------- Header ---------- */
  .brand { display: flex; align-items: flex-end; justify-content: space-between; margin: 8px 4px 18px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
  .brand h1 .bang { color: var(--blue); }
  .brand p { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
  .rx-badge {
    width: 46px; height: 46px; border-radius: 14px;
    background: var(--navy); color: #fff;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 800; font-style: italic;
    transform: rotate(-6deg);
    box-shadow: var(--shadow);
  }

  /* ---------- Tabs ---------- */
  .tabs {
    position: relative;
    display: grid; grid-template-columns: 1fr 1fr;
    background: #E9EEF5;
    padding: 5px; border-radius: 18px;
    margin-bottom: 18px;
  }
  .tab-indicator {
    position: absolute; top: 5px; left: 5px;
    width: calc(50% - 5px); height: calc(100% - 10px);
    background: var(--card); border-radius: 14px;
    box-shadow: 0 4px 14px -6px rgba(30,41,59,.25);
    transition: transform .4s var(--ease);
  }
  .tabs[data-active="1"] .tab-indicator { transform: translateX(100%); }
  .tab-btn {
    position: relative; z-index: 1;
    border: 0; background: transparent;
    padding: 13px 6px; font-size: 14.5px; font-weight: 700;
    color: var(--muted); cursor: pointer;
    transition: color .3s;
  }
  .tab-btn.active { color: var(--navy); }

  /* ---------- Panels ---------- */
  .panel { display: none; }
  .panel.active { display: block; animation: panelIn .45s var(--ease); }
  @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }

  .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .step-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--sky); color: var(--blue);
    font-size: 12px; font-weight: 800;
    display: grid; place-items: center; flex-shrink: 0;
    transition: background .3s, color .3s;
  }
  .step.done .step-num { background: var(--blue); color: #fff; }
  .step-title { font-size: 16px; font-weight: 800; }
  .step + .step { margin-top: 24px; padding-top: 22px; border-top: 1px dashed var(--line); }

  .auto-detect {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600; color: var(--blue);
    background: var(--sky); padding: 7px 12px; border-radius: var(--radius-sm);
    margin-bottom: 12px;
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); position: relative; }
  .pulse::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--blue); opacity: .5;
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.6); opacity: 0; } }

  /* ---------- Chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.grid-2 { display: grid; grid-template-columns: 1fr 1fr; }
  .chip {
    border: 1.5px solid var(--line);
    background: #fff;
    padding: 12px 14px;
    border-radius: 16px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: left;
    line-height: 1.3;
    transition: border-color .2s, background .2s, color .2s, transform .15s var(--ease);
  }
  .chip small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .chip:active { transform: scale(.96); }
  .chip:hover { border-color: var(--sky-2); }
  .chip.selected {
    border-color: var(--navy); background: var(--navy); color: #fff;
  }
  .chip.selected small { color: #CBD5E1; }
  .chip:focus-visible, .tab-btn:focus-visible, .cta:focus-visible, .ghost-btn:focus-visible, .shop-btn:focus-visible {
    outline: 3px solid var(--sky-2); outline-offset: 2px;
  }
  .chip.wide { flex: 1 1 100%; }

  .date-field {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-radius: 18px;
    border: 1.5px solid var(--line); background: #fff; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .date-field:hover { border-color: var(--sky-2); }
  .date-field.filled { border-color: var(--navy); background: var(--sky); }
  .date-field .cal { font-size: 24px; }
  .date-field .txt { flex: 1; }
  .date-field .main { font-size: 16px; font-weight: 700; }
  .date-field .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .date-field .dday {
    font-size: 13px; font-weight: 800; color: #fff; background: var(--navy);
    padding: 6px 11px; border-radius: 999px; display: none;
  }
  .date-field.filled .dday { display: inline-block; animation: panelIn .3s var(--ease); }
  .date-input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; border: 0; font: inherit;
  }
  .date-input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }

  /* ---------- CTA ---------- */
  .cta {
    width: 100%; border: 0; cursor: pointer;
    background: var(--navy); color: #fff;
    padding: 19px; border-radius: 20px;
    font-size: 17px; font-weight: 800;
    box-shadow: 0 14px 28px -12px rgba(30,41,59,.55);
    transition: transform .15s var(--ease), opacity .2s, background .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .cta:active { transform: scale(.98); }
  .cta[disabled] { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .cta.pink { background: linear-gradient(135deg, #1E293B, #3B4F7A); }
  .cta-hint { text-align: center; font-size: 12.5px; color: var(--muted); margin: 10px 0 0; min-height: 16px; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.3); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Prescription result (the signature element) ---------- */
  .result { margin-top: 22px; }
  .rx {
    position: relative;
    background: #fff;
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: rxIn .6s var(--ease);
  }
  @keyframes rxIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); clip-path: inset(0 0 60% 0 round 22px); }
    to { opacity: 1; transform: none; clip-path: inset(0 0 0 0 round 22px); }
  }
  .rx.swap { animation: rxSwap .5s var(--ease); }
  @keyframes rxSwap {
    0% { transform: rotateX(0); } 45% { transform: rotateX(80deg); opacity: .4; }
    55% { transform: rotateX(-80deg); opacity: .4; } 100% { transform: rotateX(0); opacity: 1; }
  }
  .rx-top {
    background: var(--navy); color: #fff;
    padding: 20px 20px 26px; position: relative;
  }
  .rx-top::after {
    /* perforated tear line */
    content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 16px;
    background: radial-gradient(circle at 8px 8px, #fff 6px, transparent 6.5px) repeat-x;
    background-size: 16px 16px;
  }
  .rx-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: #94A3B8; font-weight: 600; }
  .rx-title { font-size: 21px; font-weight: 800; line-height: 1.35; margin: 12px 0 10px; letter-spacing: -0.03em; }
  .rx-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .rx-tag { font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: var(--radius-sm); background: rgba(255,255,255,.12); color: #E2E8F0; }
  .rx-body { padding: 26px 20px 20px; position: relative; }
  .rx-stamp {
    position: absolute; right: 16px; top: 18px;
    width: 76px; height: 76px; border-radius: 50%;
    border: 2.5px solid var(--blue); color: var(--blue);
    display: grid; place-items: center; text-align: center;
    font-size: 11px; font-weight: 800; line-height: 1.2;
    transform: rotate(-14deg); opacity: .85;
    animation: stamp .45s .35s var(--ease) both;
  }
  @keyframes stamp { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .85; } }
  .rx-section-label { font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 12px; }

  .formula { list-style: none; margin: 0; padding: 0; }
  .formula li {
    display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid #F1F5F9;
    opacity: 0; animation: lineIn .4s var(--ease) forwards;
  }
  .formula li:last-child { border-bottom: 0; }
  .formula li:nth-child(1) { animation-delay: .15s; }
  .formula li:nth-child(2) { animation-delay: .22s; }
  .formula li:nth-child(3) { animation-delay: .29s; }
  .formula li:nth-child(4) { animation-delay: .36s; }
  .formula li:nth-child(5) { animation-delay: .43s; }
  @keyframes lineIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  .part {
    font-size: 12px; font-weight: 700; color: var(--blue);
    background: var(--sky); border-radius: 10px; padding: 6px 0; text-align: center;
  }
  .item { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .item.none { color: var(--muted); font-weight: 500; }

  .equation {
    margin: 14px 0 0; padding: 12px 14px;
    background: #F8FAFC; border-radius: 14px;
    font-size: 13px; line-height: 1.6; color: var(--navy-2); font-weight: 500;
  }
  .tip {
    display: flex; gap: 10px; align-items: flex-start;
    margin-top: 12px; padding: 14px; border-radius: 14px;
    background: var(--sky); font-size: 14px; line-height: 1.55; font-weight: 500;
  }
  .tip b { display: block; font-size: 12.5px; color: var(--blue); margin-bottom: 2px; }
  .tip .ico { font-size: 18px; line-height: 1.3; }
  .tip.soft { background: #F8FAFC; }

  .rx-actions { display: grid; gap: 8px; padding: 0 20px 20px; }
  .ghost-btn {
    border: 1.5px solid var(--line); background: #fff; cursor: pointer;
    padding: 14px; border-radius: 16px; font-size: 14.5px; font-weight: 700;
    transition: background .2s, transform .15s var(--ease), border-color .2s;
  }
  .ghost-btn:hover { background: #F8FAFC; border-color: var(--sky-2); }
  .ghost-btn:active { transform: scale(.98); }
  .ghost-btn.primary { background: var(--sky); border-color: var(--sky); color: var(--navy); }

  /* ---------- Forecast ---------- */
  .forecast {
    display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
    padding: 16px; border-radius: 18px; background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
    margin-bottom: 18px;
  }
  .fc-icon { font-size: 40px; line-height: 1; }
  .fc-temp { font-size: 30px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
  .fc-temp span { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .fc-msg { font-size: 13.5px; line-height: 1.5; margin-top: 6px; font-weight: 500; color: var(--navy-2); }

  /* ---------- Shopping ---------- */
  .shop { padding: 20px; border-top: 8px solid #F1F5F9; }
  .shop h3 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
  .shop .sub { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
  .shop-list { display: grid; gap: 10px; }
  .shop-card {
    display: grid; grid-template-columns: 64px 1fr; gap: 12px;
    padding: 12px; border: 1.5px solid var(--line); border-radius: 18px;
    opacity: 0; animation: lineIn .4s var(--ease) forwards;
  }
  .shop-card:nth-child(1) { animation-delay: .2s; }
  .shop-card:nth-child(2) { animation-delay: .3s; }
  .shop-card:nth-child(3) { animation-delay: .4s; }
  .thumb {
    width: 64px; height: 64px; border-radius: 14px;
    display: grid; place-items: center; font-size: 30px;
    background: var(--sky);
  }
  .shop-name { font-size: 14.5px; font-weight: 800; }
  .shop-why { font-size: 12.5px; color: var(--muted); margin: 3px 0 6px; line-height: 1.45; }
  .shop-price { font-size: 13px; font-weight: 800; color: var(--blue); }
  .shop-btn {
    grid-column: 1 / -1;
    border: 0; cursor: pointer; margin-top: 2px;
    background: var(--navy); color: #fff;
    padding: 11px; border-radius: 12px; font-size: 13px; font-weight: 700;
    transition: transform .15s var(--ease), background .2s;
  }
  .shop-btn:hover { background: var(--navy-2); }
  .shop-btn:active { transform: scale(.98); }

  /* ---------- Toast & Modal ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translate(-50%, 30px); opacity: 0;
    background: var(--navy); color: #fff;
    padding: 13px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.4);
    transition: transform .35s var(--ease), opacity .35s;
    pointer-events: none; z-index: 50;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 40;
  }
  .modal-bg.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 430px; background: #fff;
    border-radius: 28px 28px 0 0; padding: 12px 22px 28px;
    transform: translateY(100%); transition: transform .4s var(--ease);
  }
  .modal-bg.show .sheet { transform: none; }
  .grabber { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 18px; }
  .sheet h4 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .sheet p { margin: 0 0 18px; font-size: 14px; color: var(--muted); line-height: 1.55; }
  .mall-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .mall {
    border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 14px;
    cursor: pointer; font-weight: 800; font-size: 14.5px;
    transition: border-color .2s, background .2s;
  }
  .mall span { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 3px; }
  .mall:hover { border-color: var(--navy); background: #F8FAFC; }

  .footer-note { text-align: center; font-size: 11.5px; color: #94A3B8; margin-top: 26px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    .formula li, .shop-card { opacity: 1; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="brand">
    <div>
      <h1>이거 입어<span class="bang">!</span></h1>
      <p>고민은 3초면 충분해요. 코디 처방전</p>
    </div>
    <div class="rx-badge" aria-hidden="true">Rx</div>
  </header>

  <nav class="tabs" data-active="0" role="tablist">
    <div class="tab-indicator"></div>
    <button class="tab-btn active" role="tab" data-tab="0">☀️ 오늘 당장 뭐 입지?</button>
    <button class="tab-btn" role="tab" data-tab="1">💘 D-Day 코디 준비</button>
  </nav>

  <!-- ================= TAB 1 ================= -->
  <section class="panel active" id="panel-0">
    <div class="card">
      <div class="step done" data-step="weather">
        <div class="step-head"><div class="step-num">1</div><div class="step-title">오늘 날씨</div></div>
        <div class="auto-detect"><span class="pulse"></span>현재 서울의 날씨 자동 감지됨</div>
        <div class="chips grid-2" data-group="weather">
          <button class="chip" data-value="hot">☀️ 24°C<small>더움</small></button>
          <button class="chip" data-value="mild">🌤️ 19°C<small>선선함</small></button>
          <button class="chip selected" data-value="cross">🍂 13°C<small>일교차 큼</small></button>
          <button class="chip" data-value="cold">❄️ 4°C<small>추움</small></button>
        </div>
      </div>

      <div class="step" data-step="schedule">
        <div class="step-head"><div class="step-num">2</div><div class="step-title">오늘의 일정</div></div>
        <div class="chips grid-2" data-group="schedule">
          <button class="chip" data-value="home">🛋️ 집콕/편한 약속</button>
          <button class="chip" data-value="school">🎒 학교/강의실</button>
          <button class="chip" data-value="meet">💼 중요한 발표/미팅</button>
          <button class="chip" data-value="date">💑 데이트</button>
        </div>
      </div>

      <div class="step" data-step="mood">
        <div class="step-head"><div class="step-num">3</div><div class="step-title">오늘의 귀찮음 지수</div></div>
        <div class="chips" data-group="mood">
          <button class="chip wide" data-value="0">😪 만사 귀찮음<small>최대한 편하게</small></button>
          <button class="chip wide" data-value="1">🙂 기분 전환<small>조금 신경 씀</small></button>
          <button class="chip wide" data-value="2">✨ 오늘은 완전 꾸꾸꾸<small>예쁘게 입을래요</small></button>
        </div>
      </div>
    </div>

    <button class="cta" id="btn-today" disabled>오늘의 착장 처방받기</button>
    <p class="cta-hint" id="hint-today">일정과 귀찮음 지수를 골라주세요</p>

    <div class="result" id="result-today"></div>
  </section>

  <!-- ================= TAB 2 ================= -->
  <section class="panel" id="panel-1">
    <div class="card">
      <div class="step" data-step="when">
        <div class="step-head"><div class="step-num">1</div><div class="step-title">언제 만나나요?</div></div>
        <label class="date-field" id="date-field">
          <span class="cal">📅</span>
          <span class="txt">
            <span class="main" id="date-main">날짜를 선택해 주세요</span>
            <span class="sub" id="date-sub">데이트, 기념일, 면접 등 약속 날짜</span>
          </span>
          <span class="dday" id="date-dday"></span>
          <input type="date" class="date-input" id="custom-date" aria-label="약속 날짜 선택" />
        </label>
      </div>

      <div class="step" data-step="situation">
        <div class="step-head"><div class="step-num">2</div><div class="step-title">어떤 자리인가요?</div></div>
        <div class="chips" data-group="situation">
          <button class="chip" data-value="date">💑 데이트</button>
          <button class="chip" data-value="blind">🌷 소개팅</button>
          <button class="chip" data-value="interview">👔 면접</button>
          <button class="chip" data-value="wedding">💐 결혼식 하객</button>
          <button class="chip" data-value="travel">🧳 여행</button>
        </div>
      </div>

      <div class="step" data-step="activity">
        <div class="step-head"><div class="step-num">3</div><div class="step-title">주로 어디서 보내나요?</div></div>

/* =========================================================
   STATE & HELPERS
   ========================================================= */
const state = {
  weather: "cross", schedule: null, mood: null,
  when: null, situation: null, activity: null,
  pick: 0,
};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
const fmtDate = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const dDiff = (d) => Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000);

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- Tabs ---------- */
$$(".tab-btn").forEach((btn) => btn.addEventListener("click", () => {
  const i = btn.dataset.tab;
  $(".tabs").dataset.active = i;
  $$(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
  $$(".panel").forEach((p) => p.classList.toggle("active", p.id === `panel-${i}`));
}));

/* ---------- Tab 2 날짜 선택 ---------- */
const dLabel = (d) => (d === 0 ? "D-Day" : `D-${d}`);
(function setupDatePicker() {
  const input = $("#custom-date");
  const today = startOfDay(new Date());
  const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  input.min = toISO(today);
  const max = new Date(today); max.setFullYear(max.getFullYear() + 1);
  input.max = toISO(max);

  input.addEventListener("change", () => {
    const field = $("#date-field");
    if (!input.value) {
      state.when = null;
      field.classList.remove("filled");
      $("#date-main").textContent = "날짜를 선택해 주세요";
      $("#date-sub").textContent = "데이트, 기념일, 면접 등 약속 날짜";
      field.closest(".step").classList.remove("done");
    } else {
      const d = new Date(input.value + "T00:00:00");
      const diff = dDiff(d);
      state.when = d.toISOString();
      field.classList.add("filled");
      $("#date-main").textContent = fmtDate(d);
      $("#date-sub").textContent = diff === 0 ? "바로 오늘이에요!" : `${diff}일 남았어요`;
      $("#date-dday").textContent = dLabel(diff);
      field.closest(".step").classList.add("done");
    }
    updateButtons();
  });
})();

/* ---------- Chip selection (공통) ---------- */
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const group = chip.parentElement.dataset.group;
  $$(".chip", chip.parentElement).forEach((c) => c.classList.toggle("selected", c === chip));
  const v = chip.dataset.value;

  state[group] = group === "mood" ? Number(v) : v;
  chip.closest(".step")?.classList.add("done");
  updateButtons();
});

function updateButtons() {
  const ok1 = state.weather && state.schedule && state.mood !== null;
  $("#btn-today").disabled = !ok1;
  $("#hint-today").textContent = ok1 ? "준비 완료! 눌러보세요" : "일정과 귀찮음 지수를 골라주세요";

  const ok2 = state.when && state.situation && state.activity;
  $("#btn-dday").disabled = !ok2;
  $("#hint-dday").textContent = ok2 ? "그날 날씨까지 분석해 드릴게요" : "날짜, 자리, 활동을 골라주세요";
}

function withLoading(btn, label, fn) {
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${label}`;
  setTimeout(() => { btn.innerHTML = original; btn.disabled = false; fn(); }, 650);
}

   TAB 1 · 오늘의 처방
   ========================================================= */
function todayPool() {
  return WARDROBE[state.weather][state.schedule].filter((o) => o.m.includes(String(state.mood)));
}

function renderToday(isSwap) {
  const pool = todayPool();
  const outfit = pool[state.pick % pool.length];
  const w = WEATHER[state.weather], sc = SCHEDULE[state.schedule], md = MOOD[state.mood];
  const title = `${w.word} ${sc.word} ${md.word} 처방전`;
  const no = String(Math.floor(Math.random() * 9000) + 1000);
  const now = new Date();

  const rows = [["상의", outfit.t], ["하의", outfit.b], ["아우터", outfit.o], ["신발", outfit.s]];
  if (outfit.a) rows.push(["포인트", outfit.a]);

  const eq = [outfit.t, outfit.b, outfit.o !== NO && outfit.o !== "셔츠가 아우터 역할" ? outfit.o : null, outfit.s]
    .filter(Boolean).join(" + ");

  state.lastToday = { title, rows, tip: rand(w.tips), point: rand(md.points), w, sc, md };

  $("#result-today").innerHTML = `
    <article class="rx ${isSwap ? "swap" : ""}">
      <div class="rx-top">
        <div class="rx-meta"><span>처방 No.${no}</span><span>${fmtDate(now)}</span></div>
        <div class="rx-title">${title}</div>
        <div class="rx-tags">
          <span class="rx-tag">${w.label}</span><span class="rx-tag">${sc.label}</span><span class="rx-tag">${md.label}</span>
        </div>
      </div>
      <div class="rx-body">
        <div class="rx-stamp">이거<br>입어!<br>처방완료</div>
        <div class="rx-section-label">추천 조합 공식</div>
        <ul class="formula">
          ${rows.map(([p, v]) => `<li><span class="part">${p}</span><span class="item ${v === NO ? "none" : ""}">${v}</span></li>`).join("")}
        </ul>
        <div class="equation">${eq}</div>
        <div class="tip"><span class="ico">🌡️</span><div><b>날씨 맞춤 팁</b>${state.lastToday.tip}</div></div>
        <div class="tip soft"><span class="ico">💡</span><div><b>스타일링 포인트</b>${state.lastToday.point}</div></div>
      </div>
      <div class="rx-actions">
        <button class="ghost-btn primary" id="btn-reroll">🔄 다른 기본템 조합으로 돌리기</button>
        <button class="ghost-btn" id="btn-share">📤 친구에게 처방전 공유하기</button>
      </div>
    </article>`;

  $("#btn-reroll").onclick = () => {
    const len = todayPool().length;
    state.pick = (state.pick + 1) % len;
    renderToday(true);
    toast(`새 조합 처방 완료 (${state.pick + 1}/${len})`);
  };
  $("#btn-share").onclick = () => {
    const r = state.lastToday;
    const text = `💊 [이거 입어!] ${r.title}\n\n` +
      r.rows.map(([p, v]) => `· ${p}: ${v}`).join("\n") +
      `\n\n🌡️ ${r.tip}\n\n오늘 뭐 입지? 3초면 끝 👉 이거 입어!`;
    copyText(text).then(() => toast("📋 처방전이 복사됐어요! 친구에게 붙여넣기 하세요"));
  };
}

$("#btn-today").addEventListener("click", (e) => {
  state.pick = Math.floor(Math.random() * todayPool().length);
  withLoading(e.currentTarget, "처방전 작성 중...", () => {
    renderToday(false);
    $("#result-today").scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

/* =========================================================
   TAB 2 · D-Day 예보 & 코디
   ========================================================= */
function forecastFor(date) {
  // 날짜를 시드로 쓰는 의사 난수 → 같은 날짜는 항상 같은 예보
  const seed = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
  const r = (n) => { const x = Math.sin(seed * (n + 1)) * 10000; return x - Math.floor(x); };
  const temp = Math.round(SEOUL_AVG[date.getMonth()] + (r(1) * 6 - 3));
  const gap = 6 + Math.round(r(2) * 5);
  const cond = r(3) < 0.5 ? "sun" : r(3) < 0.75 ? "cloud" : r(3) < 0.9 ? "wind" : "rain";
  const band = temp >= 22 ? "hot" : temp >= 16 ? "mild" : temp >= 8 ? "cross" : "cold";
  return { temp, low: temp - gap, high: temp + Math.round(gap / 3), cond, band };
}

const COND = {
  sun:   { icon: "☀️", word: "맑음", note: "하늘은 맑을 예정이에요." },
  cloud: { icon: "⛅", word: "구름 조금", note: "구름이 끼지만 비 소식은 없어요." },
  wind:  { icon: "🌬️", word: "바람 강함", note: "바람이 꽤 불어 체감 온도는 더 낮을 거예요." },
  rain:  { icon: "🌧️", word: "비 소식", note: "비 소식이 있어요. 스웨이드·밝은 바지는 피하는 게 좋아요." },
};

function renderDday() {
  const date = new Date(state.when);
  const d = dDiff(date);
  const fc = forecastFor(date);
  const c = COND[fc.cond];
  const occ = OCCASION[state.situation];
  const look = occ.data[fc.band];
  const act = ACTIVITY[state.activity];

  const eveningMsg = fc.temp - fc.low >= 8
    ? `저녁엔 ${fc.low}°C까지 떨어져 쌀쌀할 예정이에요!`
    : `밤까지 기온 변화가 크지 않아 편할 거예요.`;
  const range = d > 10 ? " (장기 예보라 평년 기온 기준이에요)" : "";
  const parts = ["상의", "하의", "아우터", "신발", "포인트"];

  const shipping = d === 0
    ? "오늘이 D-Day예요! 배송은 늦으니 옷장 속 비슷한 아이템으로 대체해 보세요."
    : d <= 2
    ? "D-Day가 코앞이에요. 오늘 주문하면 내일 오는 빠른배송 상품 위주로 보세요."
    : `D-${d}, 지금 주문하면 넉넉하게 도착해요. 미리 입어보고 교환할 시간도 있어요.`;

  $("#result-dday").innerHTML = `
    <article class="rx">
      <div class="rx-top">
        <div class="rx-meta"><span>${dLabel(d)} 예보 분석</span><span>${fmtDate(date)}</span></div>
        <div class="rx-title">${occ.word} 처방전</div>
        <div class="rx-tags">
          <span class="rx-tag">${occ.label}</span><span class="rx-tag">${act.label}</span><span class="rx-tag">${c.icon} ${c.word}</span>
        </div>
      </div>
      <div class="rx-body">
        <div class="forecast">
          <div class="fc-icon">${c.icon}</div>
          <div>
            <div class="fc-temp">${fc.temp}°C<span>최저 ${fc.low}° / 최고 ${fc.high}°</span></div>
            <div class="fc-msg">해당 날짜 예상 기온 ${fc.temp}°C, ${eveningMsg} ${c.note}${range}</div>
          </div>
        </div>
        <div class="rx-section-label">${occ.word} 공식</div>
        <ul class="formula">
          ${look.f.map((v, i) => `<li><span class="part">${parts[i]}</span><span class="item ${v === NO ? "none" : ""}">${v}</span></li>`).join("")}
        </ul>
        <div class="tip"><span class="ico">📍</span><div><b>${act.label} 팁</b>${act.tip}</div></div>
        ${state.situation === "wedding" ? `<div class="tip soft"><span class="ico">💐</span><div><b>하객 매너</b>올화이트·아이보리 원피스는 신부와 겹쳐요. 너무 화려한 레드·블랙 올착장도 피해 주세요.</div></div>` : ""}
        ${state.situation === "interview" ? `<div class="tip soft"><span class="ico">🧾</span><div><b>면접 체크</b>전날 셔츠 다림질, 구두 광택, 손톱 정리까지 확인하면 완벽해요.</div></div>` : ""}
      </div>
      <section class="shop">
        <h3>옷장에 이 조합이 없다면? D-Day 전 도착 추천템</h3>
        <p class="sub">${shipping}</p>
        <div class="shop-list">
          ${look.shop.map((s) => `
            <div class="shop-card">
              <div class="thumb">${s.emoji}</div>
              <div>
                <div class="shop-name">${s.n}</div>
                <div class="shop-why">${s.why}</div>
                <div class="shop-price">예상 ${s.price}</div>
              </div>
              <button class="shop-btn" data-item="${s.n}">무신사/지그재그에서 최저가 보기</button>
            </div>`).join("")}
        </div>
      </section>
    </article>`;

  $$(".shop-btn").forEach((b) => b.addEventListener("click", () => openMall(b.dataset.item)));
}

$("#btn-dday").addEventListener("click", (e) => {
  withLoading(e.currentTarget, "그날 예보 분석 중...", () => {
    renderDday();
    $("#result-dday").scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

/* ---------- 모의 쇼핑몰 이동 ---------- */
let currentItem = "";
function openMall(item) {
  currentItem = item;
  $("#sheet-desc").textContent = `'${searchKeyword(item)}' 검색 결과를 새 창으로 열어요. 어디서 볼까요?`;
  $("#modal").classList.add("show");
}
function closeMall() { $("#modal").classList.remove("show"); }
$("#sheet-close").onclick = closeMall;
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeMall(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMall(); });
const MALL_URL = {
  "무신사": (q) => `https://www.musinsa.com/search/goods?keyword=${encodeURIComponent(q)}`,
  "지그재그": (q) => `https://zigzag.kr/search?keyword=${encodeURIComponent(q)}`,
};
// "하늘색 셔츠 or 블라우스", "화이트 셔츠 2장" 같은 이름을 검색하기 좋은 키워드로 정리
function searchKeyword(name) {
  return name.split(" or ")[0].replace(/\(.*?\)/g, "").replace(/\d+장/g, "").replace(/\s+/g, " ").trim();
}
$$(".mall").forEach((m) => m.addEventListener("click", () => {
  const q = searchKeyword(currentItem);
  const win = window.open(MALL_URL[m.dataset.mall](q), "_blank");
  if (win) win.opener = null; // 보안: 새 창이 이 페이지를 조작하지 못하게
  closeMall();
  toast(win === null
    ? "팝업이 차단됐어요. 브라우저 주소창 옆에서 팝업을 허용해 주세요"
    : `🛍️ ${m.dataset.mall}에서 '${q}' 검색 결과를 열었어요`);
}));

/* ---------- 클립보드 (파일로 열어도 동작하도록 대체 방식 포함) ---------- */
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}

updateButtons();
</script>
